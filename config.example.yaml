# MT5 Guardian Configuration
# Copy this file to config.yaml and adjust values for your account.
# Secrets can also be set via environment variables:
#   MT5_LOGIN, MT5_PASSWORD, MT5_SERVER, TELEGRAM_TOKEN, TELEGRAM_CHAT_ID

mode: "observe" # Step 1: "observe" (log only). Step 2: "live" on demo. Step 3: real funds.

account:
  login: 0 # Replace with your MT5 account number (leave 0 to use the currently active terminal account)
  password: "" # Account password
  server: "" # Broker server name (e.g. "MetaQuotes-Demo")

thresholds:
  risk_pct_per_position: 5.0 # Each ticket's SL = 5% of account balance (two tickets = 10% max)
  daily_drawdown_pct: 20.0 # 20% max daily drawdown (prop-firm style: consider 5%)

anti_averaging:
  max_open_positions: 2 # Hard global cap — at most 2 managed positions at any time
  # Same-symbol rule: when a new ticket is detected on a symbol that already
  # has a managed ticket, the older ticket is closed if its floating profit
  # is <= 0.  If profit > 0 (pyramiding winner), it is kept.
  # The decision is made once, at the moment the new ticket is first detected.
  # After same-symbol handling, the global cap of 2 is enforced by closing the
  # oldest remaining ticket ordered by (open_time, ticket).
  # Positions already open when the guardian starts are treated as baseline:
  # they are subject to the global cap but not to the same-symbol profit test.

filters:
  symbols: [] # Empty = all symbols; e.g. ["EURUSD", "GBPUSD"]
  magic_numbers: [] # Empty = all magic numbers; e.g. [12345]

execution:
  close_deviation: 50 # Max slippage in points when closing positions
  close_retries: 3 # Requote retries per close attempt (transient SL failures wait close_retries loops before emergency close)
  emergency_close_retry_interval: 5.0 # Seconds between retry attempts if an emergency close order fails at the broker
  server_time_symbol: "EURUSD" # Symbol used to read broker server time for day rollover

loop:
  interval_ms: 300 # Execution loop sleep time in milliseconds (200-500 recommended for scalping)

cooldown:
  after_stop_sec: 60 # Pause guardian actions after trailing stop or breaker (0 = disabled)

server:
  day_reset_hour: 0 # Hour (broker server time) when the daily breaker resets

telegram:
  token: "" # Leave empty to disable
  chat_id: ""
